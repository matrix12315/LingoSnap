[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/platform-interface",
    "windows/crates/platform-windows",
    "crates/provider-openai",
    "crates/storage",
    "crates/ui-protocol",
    "windows/apps/resident",
    "windows/apps/manager",
    "windows/apps/popup-ui",
]

[profile.release]
lto = true
codegen-units = 1
opt-level = "z"
panic = "abort"
strip = "symbols"
