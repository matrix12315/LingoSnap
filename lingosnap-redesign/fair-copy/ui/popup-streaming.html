<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>LingoSnap — 03 Popup · streaming</title>
<link rel="stylesheet" href="fair-copy.css" />
<style>
  body { display: flex; flex-direction: column; align-items: center; gap: 20px; padding: 56px 32px 72px; }
  .cap { font: 500 10.5px var(--mono); letter-spacing: .12em; color: rgba(241, 235, 223, .55); }
</style>
</head>
<body>

<div class="caprow"><div class="cap">03 · POPUP — WHILE THE INK IS STILL FLOWING</div><button class="themebtn" type="button">Dark theme</button></div>

<div class="card pop">
  <div class="chrome">
    <div class="seal" aria-hidden="true"><svg viewBox="0 0 100 100" width="100%" height="100%" fill="currentColor" aria-hidden="true"><rect x="18" y="25" width="26" height="10" rx="5"/><rect x="18" y="49" width="64" height="10" rx="5"/><rect x="18" y="67" width="44" height="10" rx="5"/><path d="M67 4L71.2 22.8L90 27L71.2 31.2L67 50L62.8 31.2L44 27L62.8 22.8Z"/></svg></div>
    <div class="who">
      <strong>LingoSnap</strong>
      <span><i class="live-dot"></i><span class="lbl" data-i18n="writing">writing…</span></span>
    </div>
    <button class="iconbtn" type="button" title="Pin" aria-label="Pin" data-i18n-title="pin" data-i18n-aria="pin">
      <svg width="15" height="15" viewBox="0 0 15 15" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
        <path d="M7.5 9.5v4"/>
        <path d="M4.5 5.5c0-1.7 1.3-3 3-3s3 1.3 3 3c0 1.2-.7 2.2-1.5 2.8h-3C5.2 7.7 4.5 6.7 4.5 5.5z"/>
      </svg>
    </button>
    <button class="iconbtn" type="button" title="Close" aria-label="Close" data-i18n-title="close" data-i18n-aria="close" data-act="close">
      <svg width="13" height="13" viewBox="0 0 13 13" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round">
        <path d="M2.5 2.5l8 8M10.5 2.5l-8 8"/>
      </svg>
    </button>
  </div>

  <div class="sourcepanel float">
    <div class="target">opacity</div>
    <div class="context">…so the element fades by lowering its opacity while keeping its layout space.</div>
  </div>


  <div class="manuscript">
    <div class="sec">
      <h3>Translation</h3>
      <div class="trans">不透明度<span class="caret" aria-hidden="true"></span></div>
    </div>
    <div class="sec">
      <h3>Words</h3>
      <div class="word">
        <span class="lemma">opacity</span><span class="ipa">/oʊˈpæsəti/</span><span class="pos">n.</span>
        <div class="sense">不透明度；朦胧，不清晰</div>
      </div>
    </div>
    <div class="sec">
      <h3>Idioms &amp; Grammar</h3>
      <p class="streaming-note">uncountable noun — writing…</p>
    </div>
  </div>

  <div class="foot">
    <button class="btn primary" type="button" disabled style="opacity:.55">
      <svg width="13" height="13" viewBox="0 0 13 13" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">
        <rect x="4.2" y="4.2" width="7" height="7" rx="1.2"/>
        <path d="M8.8 4.2V2.9a1 1 0 0 0-1-1H2.9a1 1 0 0 0-1 1v4.9a1 1 0 0 0 1 1h1.3"/>
      </svg>
      <span data-i18n="copy">Copy</span>
    </button>
    <button class="btn" type="button">
      <svg width="13" height="13" viewBox="0 0 13 13" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">
        <path d="M10.8 6.5a4.3 4.3 0 1 1-1.3-3.1"/>
        <path d="M10.9 1.6v2.3H8.6"/>
      </svg>
      <span data-i18n="cancel">Cancel</span>
    </button>
    <button class="btn push" type="button" style="padding:0 10px" data-act="close" data-i18n="close">Close</button>
  </div>
  <span class="resize-grip" aria-hidden="true" title="Drag to resize" data-i18n-title="resize"></span>
</div>

<script>
  // The manuscript's first section must always clear the floating glass panel,
  // whatever the quote and context wrap to — size the top padding from the panel.
  (function () {
    var sp = document.querySelector('.sourcepanel.float'), m = document.querySelector('.manuscript');
    if (!sp || !m) return;
    var fit = function () { m.style.paddingTop = (sp.offsetTop + sp.offsetHeight - m.offsetTop + 24) + 'px'; };
    fit();
    if (window.ResizeObserver) new ResizeObserver(fit).observe(sp);
    window.addEventListener('resize', fit);
  })();
</script>
<script src="strings.js"></script>
<script src="theme.js"></script>
<script src="liquid-lens.js"></script>
</body>
</html>
