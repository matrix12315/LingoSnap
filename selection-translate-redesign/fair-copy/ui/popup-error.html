<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>LingoSnap — 04 Popup · local error</title>
<link rel="stylesheet" href="fair-copy.css" />
<style>
  body { display: flex; flex-direction: column; align-items: center; gap: 20px; padding: 56px 32px 72px; }
  .cap { font: 500 10.5px var(--mono); letter-spacing: .12em; color: rgba(241, 235, 223, .55); }
</style>
</head>
<body>

<div class="caprow"><div class="cap">04 · POPUP — WHEN NOTHING LEAVES THE MACHINE</div><button class="themebtn" type="button">Dark theme</button></div>

<div class="card pop">
  <div class="chrome">
    <div class="seal" aria-hidden="true" style="background:#8A8375">译</div>
    <div class="who">
      <strong>LingoSnap</strong>
      <span>idle</span>
    </div>
    <button class="iconbtn" type="button" title="Pin" aria-label="Pin">
      <svg width="15" height="15" viewBox="0 0 15 15" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
        <path d="M7.5 9.5v4"/>
        <path d="M4.5 5.5c0-1.7 1.3-3 3-3s3 1.3 3 3c0 1.2-.7 2.2-1.5 2.8h-3C5.2 7.7 4.5 6.7 4.5 5.5z"/>
      </svg>
    </button>
    <button class="iconbtn" type="button" title="Close" aria-label="Close">
      <svg width="13" height="13" viewBox="0 0 13 13" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round">
        <path d="M2.5 2.5l8 8M10.5 2.5l-8 8"/>
      </svg>
    </button>
  </div>

  <div class="sourcepanel">
    <div class="target">uncommitted</div>
  </div>

  <div class="errbox">
    <div class="headline">Nothing was sent — the target text was empty.</div>
    <div class="detail">The selection contained only formatting characters. Select the text itself and try again.</div>
    <div class="actions">
      <button class="btn sm" type="button">Retry</button>
      <button class="btn sm" type="button">Close</button>
    </div>
  </div>
</div>

<script src="theme.js"></script>
<script src="liquid-lens.js"></script>
</body>
</html>
