<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>LingoSnap — 03 Popup · streaming</title>
<link rel="stylesheet" href="fair-copy.css" />
<style>
  body { display: flex; flex-direction: column; align-items: center; gap: 20px; padding: 56px 32px 72px; }
  .cap { font: 500 10.5px var(--mono); letter-spacing: .12em; color: rgba(241, 235, 223, .55); }
</style>
</head>
<body>

<div class="caprow"><div class="cap">03 · POPUP — WHILE THE INK IS STILL FLOWING</div><button class="themebtn" type="button">Dark theme</button></div>

<div class="card pop">
  <div class="chrome">
    <div class="seal" aria-hidden="true">译</div>
    <div class="who">
      <strong>LingoSnap</strong>
      <span><i class="live-dot"></i>writing…</span>
    </div>
    <button class="iconbtn" type="button" title="Pin" aria-label="Pin">
      <svg width="15" height="15" viewBox="0 0 15 15" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
        <path d="M7.5 9.5v4"/>
        <path d="M4.5 5.5c0-1.7 1.3-3 3-3s3 1.3 3 3c0 1.2-.7 2.2-1.5 2.8h-3C5.2 7.7 4.5 6.7 4.5 5.5z"/>
      </svg>
    </button>
    <button class="iconbtn" type="button" title="Close" aria-label="Close">
      <svg width="13" height="13" viewBox="0 0 13 13" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round">
        <path d="M2.5 2.5l8 8M10.5 2.5l-8 8"/>
      </svg>
    </button>
  </div>

  <div class="sourcepanel float">
    <div class="target">opacity</div>
    <div class="context">…so the element fades by lowering its opacity while keeping its layout space.</div>
  </div>


  <div class="manuscript">
    <div class="sec">
      <h3><span class="rm" >＊</span>Translation</h3>
      <div class="trans">不透明度<span class="caret" aria-hidden="true"></span></div>
    </div>
    <div class="sec">
      <h3><span class="rm">†</span>Words</h3>
      <div class="word">
        <span class="lemma">opacity</span><span class="ipa">/oʊˈpæsəti/</span><span class="pos">n.</span>
        <div class="sense">不透明度；朦胧，不清晰</div>
      </div>
    </div>
    <div class="sec">
      <h3><span class="rm">‡</span>Idioms &amp; Grammar</h3>
      <p class="streaming-note">uncountable noun — writing…</p>
    </div>
  </div>

  <div class="foot">
    <button class="btn primary" type="button" disabled style="opacity:.55">
      <svg width="13" height="13" viewBox="0 0 13 13" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">
        <rect x="4.2" y="4.2" width="7" height="7" rx="1.2"/>
        <path d="M8.8 4.2V2.9a1 1 0 0 0-1-1H2.9a1 1 0 0 0-1 1v4.9a1 1 0 0 0 1 1h1.3"/>
      </svg>
      Copy
    </button>
    <button class="btn" type="button">
      <svg width="13" height="13" viewBox="0 0 13 13" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">
        <path d="M10.8 6.5a4.3 4.3 0 1 1-1.3-3.1"/>
        <path d="M10.9 1.6v2.3H8.6"/>
      </svg>
      Cancel
    </button>
    <button class="btn push" type="button" style="padding:0 10px">Close</button>
  </div>
</div>

<script src="theme.js"></script>
<script src="liquid-lens.js"></script>
</body>
</html>
