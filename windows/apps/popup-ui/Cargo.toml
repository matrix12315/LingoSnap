[package]
name = "lingosnap-ui"
version = "0.1.0"
edition = "2021"

[dependencies]
selection-ui-protocol = { path = "../../../crates/ui-protocol" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
# webview2-com 0.39 binds against windows 0.62; the workspace core still uses
# 0.61, so this crate deliberately stays on 0.62 and exchanges only plain
# integers over the pipe protocol — no HWND crosses a version boundary.
webview2-com = "0.39"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Graphics_Gdi",
    "Win32_Globalization",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_System_Ole",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Storage_FileSystem",
    "Win32_System_Pipes",
    "Win32_System_IO",
] }

[[bin]]
name = "lingosnap-ui"
path = "src/main.rs"
